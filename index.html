<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Game</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
      }

      .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .scoreboard {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-size: 2.5rem;
        font-weight: bold;
        letter-spacing: 2px;
      }

      canvas {
        background: #000;
        border: 3px solid #fff;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="scoreboard">
        <div id="playerScore">0</div>
        <div>:</div>
        <div id="computerScore">0</div>
      </div>
      <canvas id="gameCanvas" width="900" height="500"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const playerScoreEl = document.getElementById("playerScore");
      const computerScoreEl = document.getElementById("computerScore");

      const paddleWidth = 12;
      const paddleHeight = 90;
      const paddleSpeed = 7;
      const ballRadius = 10;
      const winningScore = 7;

      let leftPaddleY = canvas.height / 2 - paddleHeight / 2;
      let rightPaddleY = canvas.height / 2 - paddleHeight / 2;
      let ballX = canvas.width / 2;
      let ballY = canvas.height / 2;
      let ballSpeedX = 5;
      let ballSpeedY = 4;
      let playerScore = 0;
      let computerScore = 0;

      const keys = {
        ArrowUp: false,
        ArrowDown: false,
      };

      let mouseY = canvas.height / 2;

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowUp") keys.ArrowUp = true;
        if (event.key === "ArrowDown") keys.ArrowDown = true;
      });

      document.addEventListener("keyup", (event) => {
        if (event.key === "ArrowUp") keys.ArrowUp = false;
        if (event.key === "ArrowDown") keys.ArrowDown = false;
      });

      canvas.addEventListener("mousemove", (event) => {
        const rect = canvas.getBoundingClientRect();
        mouseY = event.clientY - rect.top;
        leftPaddleY = mouseY - paddleHeight / 2;
      });

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function resetBall(direction) {
        ballX = canvas.width / 2;
        ballY = canvas.height / 2;
        const angle = (Math.random() * Math.PI) / 3 - Math.PI / 6;
        const speed = 5;
        ballSpeedX = direction * speed * Math.cos(angle);
        ballSpeedY = speed * Math.sin(angle);
      }

      function drawPaddle(x, y) {
        ctx.fillStyle = "#fff";
        ctx.fillRect(x, y, paddleWidth, paddleHeight);
      }

      function drawBall(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.closePath();
      }

      function drawMiddleLine() {
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function update() {
        if (keys.ArrowUp) leftPaddleY -= paddleSpeed;
        if (keys.ArrowDown) leftPaddleY += paddleSpeed;
        leftPaddleY = clamp(leftPaddleY, 0, canvas.height - paddleHeight);

        const paddleCenter = rightPaddleY + paddleHeight / 2;
        const target = ballY - paddleHeight / 2;

        if (ballX > canvas.width / 2) {
          if (paddleCenter < ballY) {
            rightPaddleY += paddleSpeed * 0.9;
          } else if (paddleCenter > ballY) {
            rightPaddleY -= paddleSpeed * 0.9;
          }
        }

        rightPaddleY = clamp(rightPaddleY, 0, canvas.height - paddleHeight);

        ballX += ballSpeedX;
        ballY += ballSpeedY;

        if (ballY - ballRadius <= 0 || ballY + ballRadius >= canvas.height) {
          ballSpeedY *= -1;
          ballY = clamp(ballY, ballRadius, canvas.height - ballRadius);
        }

        if (
          ballX - ballRadius <= 20 + paddleWidth &&
          ballX - ballRadius >= 20 &&
          ballY >= leftPaddleY &&
          ballY <= leftPaddleY + paddleHeight &&
          ballSpeedX < 0
        ) {
          const hitPosition = (ballY - (leftPaddleY + paddleHeight / 2)) / (paddleHeight / 2);
          ballSpeedX = Math.abs(ballSpeedX) + 0.2;
          ballSpeedY = hitPosition * 6;
          ballX = 20 + paddleWidth + ballRadius;
        }

        if (
          ballX + ballRadius >= canvas.width - 20 - paddleWidth &&
          ballX + ballRadius <= canvas.width - 20 &&
          ballY >= rightPaddleY &&
          ballY <= rightPaddleY + paddleHeight &&
          ballSpeedX > 0
        ) {
          const hitPosition = (ballY - (rightPaddleY + paddleHeight / 2)) / (paddleHeight / 2);
          ballSpeedX = -Math.abs(ballSpeedX) - 0.2;
          ballSpeedY = hitPosition * 6;
          ballX = canvas.width - 20 - paddleWidth - ballRadius;
        }

        if (ballX < 0) {
          computerScore++;
          computerScoreEl.textContent = computerScore;
          if (computerScore >= winningScore) {
            alert("Computer wins! Press OK to restart.");
            playerScore = 0;
            computerScore = 0;
            playerScoreEl.textContent = "0";
            computerScoreEl.textContent = "0";
          }
          resetBall(1);
        }

        if (ballX > canvas.width) {
          playerScore++;
          playerScoreEl.textContent = playerScore;
          if (playerScore >= winningScore) {
            alert("You win! Press OK to restart.");
            playerScore = 0;
            computerScore = 0;
            playerScoreEl.textContent = "0";
            computerScoreEl.textContent = "0";
          }
          resetBall(-1);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawMiddleLine();
        drawPaddle(20, leftPaddleY);
        drawPaddle(canvas.width - 20 - paddleWidth, rightPaddleY);
        drawBall(ballX, ballY);
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      resetBall(Math.random() < 0.5 ? -1 : 1);
      gameLoop();
    </script>
  </body>
</html>
